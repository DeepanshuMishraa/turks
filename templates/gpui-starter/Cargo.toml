[workspace]
resolver = "2"
members = ["crates/ui", "crates/desktop"]
default-members = ["crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "wayland",
    "x11",
] }
gpui-starter-ui = { path = "crates/ui" }
